[package]
name = "wasm-playground"
description = "Browser/WASM playground: load GeoJSON, reproject and join client-side."
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-gis"
homepage = "https://github.com/tpt-solutions/tpt-gis"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
serde_json = "1"
tpt-gis-core = { path = "../../tpt-gis-core", features = ["std"] }
tpt-gis-geom = { path = "../../tpt-gis-geom", features = ["std"] }
tpt-gis-io = { path = "../../tpt-gis-io" }
tpt-gis-index = { path = "../../tpt-gis-index" }

[profile.release]
opt-level = "s"
lto = true

[workspace]
