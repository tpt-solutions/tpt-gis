[package]
name = "spatial-join-cli"
description = "Demo + criterion benchmark for the tpt-gis spatial join engine (published as `tpt-gis-cli`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
readme = "README.md"

[lints]
workspace = true

[dependencies]
tpt-gis-cli = { path = "../../tpt-gis-cli" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tpt-gis-geom = { path = "../../tpt-gis-geom" }
tpt-gis-index = { path = "../../tpt-gis-index" }
tpt-gis-io = { path = "../../tpt-gis-io" }

[[bench]]
name = "spatial_join"
harness = false
