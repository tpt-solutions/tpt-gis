[package]
name = "spatial-join-cli"
description = "MVP 1: Planetary-Scale Spatial Join Engine — CLI binary for tpt-gis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
readme = "README.md"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1"
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
serde_json = "1"
tpt-gis-core = { path = "../../tpt-gis-core" }
tpt-gis-geom = { path = "../../tpt-gis-geom" }
tpt-gis-io = { path = "../../tpt-gis-io" }
tpt-gis-index = { path = "../../tpt-gis-index" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std_rng"] }

[[bench]]
name = "spatial_join"
harness = false
