[package]
name = "wasm-geofence-demo"
description = "Browser/WASM demo reusing the drone geofence check_position logic via wasm-bindgen."
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-gis"
homepage = "https://github.com/tpt-solutions/tpt-gis"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
tpt-gis-core = { path = "../../tpt-gis-core", features = ["std"] }
drone-geofence-demo = { path = "../drone-geofence-demo" }
