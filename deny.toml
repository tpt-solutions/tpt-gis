# cargo-deny configuration. Run `cargo deny check` (requires `cargo install cargo-deny`).
# https://embarkstudios.github.io/cargo-deny/
#
# tpt-gis strictly enforces permissive licensing — MIT/Apache-2.0-compatible only,
# zero GPL/LGPL — per spec.txt's core design principles. Any dependency whose
# license isn't in the allow list below fails CI.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
