[package]
name = "tpt-gis-index"
description = "R-Trees, Quadtrees, and H3/S2 hexagonal grid integration for tpt-gis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gis", "spatial-index", "rtree", "h3", "geospatial"]
categories = ["science::geo", "algorithms", "data-structures"]

[lints]
workspace = true

[dependencies]
tpt-gis-geom = { path = "../tpt-gis-geom", features = ["std"], version = "0.1.0" }
tpt-gis-io = { path = "../tpt-gis-io", version = "0.1.0" }
h3o = "0.10"

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
