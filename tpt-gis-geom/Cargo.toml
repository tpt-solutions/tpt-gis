[package]
name = "tpt-gis-geom"
description = "Vector geometry (points, lines, polygons) and topological predicates for tpt-gis. no_std by default."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gis", "geometry", "geospatial", "ogc", "polygon", "geo", "no-std"]
categories = ["science::geo", "algorithms"]

[lints]
workspace = true

[dependencies]
libm = { version = "0.2", default-features = false }

[dev-dependencies]
proptest = "1.0"

[features]
default = []
std = []
## Allocating operations (polygon boolean ops in `clip`). Off by default so the
## base crate stays allocation-free.
alloc = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
