[package]
name = "tpt-gis-cli"
description = "Command-line tool for the tpt-gis planetary-scale GIS engine (spatial joins, reprojection, fixtures)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["gis", "geospatial", "geo", "cli", "geodesy"]
categories = ["command-line-utilities", "science::geo", "science"]
publish = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1"
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
serde_json = "1"
tpt-gis-core = { path = "../tpt-gis-core" }
tpt-gis-geom = { path = "../tpt-gis-geom" }
tpt-gis-io = { path = "../tpt-gis-io" }
tpt-gis-index = { path = "../tpt-gis-index" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bin]]
name = "tptgis"
path = "src/bin/tptgis.rs"

[lints]
workspace = true
