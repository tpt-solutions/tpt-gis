[package]
name = "tpt-gis-cli"
description = "Command-line tool for the tpt-gis planetary-scale GIS engine (spatial joins, reprojection, fixtures)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["gis", "geospatial", "geo", "cli", "geodesy"]
readme = "README.md"
categories = ["command-line-utilities", "science::geo", "science"]
publish = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde_json = "1"
tpt-gis-core = { path = "../tpt-gis-core", version = "0.1.0" }
tpt-gis-geom = { path = "../tpt-gis-geom", version = "0.1.0" }
tpt-gis-io = { path = "../tpt-gis-io", version = "0.1.0" }
tpt-gis-index = { path = "../tpt-gis-index", version = "0.1.0" }
tpt-gis-raster = { path = "../tpt-gis-raster", version = "0.1.0" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bin]]
name = "tptgis"
path = "src/bin/tptgis.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
