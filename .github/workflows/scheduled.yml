name: Scheduled

# Weekly checks that do not need to run on every change: new security advisories against the
# locked dependencies, and a short fuzz run of every parser. Run by hand with "workflow_dispatch".

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  fuzz:
    name: fuzz ${{ matrix.target }} (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The root rust-toolchain.toml pins stable, which overrides the nightly default set by the
    # toolchain action below. cargo-fuzz needs nightly, so force it for every step in this job.
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: tpt-gis-io
            target: geojson
          - crate: tpt-gis-io
            target: wkt
          - crate: tpt-gis-io
            target: wkb
          - crate: tpt-gis-io
            target: shapefile
          - crate: tpt-gis-io
            target: dbf
          - crate: tpt-gis-io
            target: geopackage
          - crate: tpt-gis-raster
            target: geotiff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ matrix.crate }}/fuzz
      - name: Fuzz for five minutes
        working-directory: ${{ matrix.crate }}/fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.crate }}-${{ matrix.target }}
          path: ${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
