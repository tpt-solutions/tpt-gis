name: Wheels

# Builds the Python wheels for the platforms the PyPI release targets, and keeps them as
# workflow artifacts. Nothing is uploaded: the publish job in ci.yml does that on version
# tags, and this workflow exists to check the build matrix ahead of a release. Run it by hand.
#
# Targets: Linux x86_64 (manylinux and musllinux), macOS universal2 (Intel and Apple silicon),
# Windows x64, and Linux aarch64 (built on GitHub's arm64 runner, not under emulation).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-x86_64
            os: ubuntu-latest
            manylinux: auto
            args: --release --out dist
          - name: musllinux-x86_64
            os: ubuntu-latest
            manylinux: musllinux_1_2
            args: --release --out dist
          - name: manylinux-aarch64
            os: ubuntu-24.04-arm
            manylinux: auto
            args: --release --out dist
          - name: macos-universal2
            os: macos-latest
            manylinux: ""
            args: --release --out dist --target universal2-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            manylinux: ""
            args: --release --out dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          # universal2 needs both Apple targets, which the action does not install itself.
          targets: ${{ matrix.name == 'macos-universal2' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheels with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: bindings/tpt-gis-py
          command: build
          args: ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux }}
      - name: Install the wheel and run the tests against it
        shell: bash
        working-directory: bindings/tpt-gis-py
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet --find-links dist tpt-gis-py
          python -m pytest -q
      - name: Keep the wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.name }}
          path: bindings/tpt-gis-py/dist/*.whl
          if-no-files-found: error
