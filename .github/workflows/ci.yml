name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # Feature-gated tests: polygon clipping (GEOS differential) and the HTTP COG reader.
      - run: cargo test -p tpt-gis-geom --features alloc
      - run: cargo test -p tpt-gis-raster --features http

  no_std:
    name: no_std cross-compile (tpt-gis-core, tpt-gis-geom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf,riscv32imc-unknown-none-elf,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p tpt-gis-core -p tpt-gis-geom --target thumbv7em-none-eabihf
      # riscv32imc-unknown-none-elf is the target for the ESP32-C3 (mainline Rust
      # support, no toolchain fork needed). The ESP32/ESP32-S3 (Xtensa) targets need
      # the community `esp-rs` toolchain fork (via `espup`) and are not yet in CI —
      # see todo.md.
      - run: cargo build -p tpt-gis-core -p tpt-gis-geom --target riscv32imc-unknown-none-elf
      - run: cargo build -p tpt-gis-core -p tpt-gis-geom --target wasm32-unknown-unknown
      - run: cargo build -p tpt-gis-core -p tpt-gis-geom --target wasm32-wasip1
      # The MVP 2 demo's own check_position logic (not just tpt-gis-core/geom) is
      # no_std-portable too, so it's ready to drop into real ESP32-C3 firmware.
      - run: cargo build -p drone-geofence-demo --lib --no-default-features --target riscv32imc-unknown-none-elf

  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace

  docs:
    name: rustdoc (warnings are errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --workspace --no-deps

  feature-powerset:
    name: feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-hack --locked
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps --exclude-no-default-features

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  license-check:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  python-bindings:
    name: Python bindings (pyo3 + maturin, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install maturin pytest mypy
      - name: Build the wheel and install it
        # `maturin develop` requires an active virtualenv; CI runners have none,
        # so build a wheel and install it straight into the runner's Python.
        working-directory: bindings/tpt-gis-py
        run: |
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist tpt-gis-py
      - name: Run the pytest suite
        working-directory: bindings/tpt-gis-py
        run: pytest -v
      - name: Check the type stubs against the extension
        run: python -m mypy.stubtest tpt_gis_py._core


  publish-python:
    name: Build & publish Python wheels (PyPI)
    if: startsWith(github.ref, 'refs/tags/')
    needs: python-bindings
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheels with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: bindings/tpt-gis-py
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Publish wheels to PyPI
        working-directory: bindings/tpt-gis-py
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install maturin
          maturin upload --skip-existing dist/*

  fuzz:
    name: cargo-fuzz (compile fuzz targets)
    runs-on: ubuntu-latest
    # The root rust-toolchain.toml pins stable, which overrides the nightly default set by the
    # toolchain action below. -Zsanitizer needs nightly, so force it for every step in this job.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz
      - name: Build tpt-gis-io fuzz targets
        run: cargo fuzz build -O
        working-directory: tpt-gis-io/fuzz
      - name: Build tpt-gis-raster fuzz targets
        run: cargo fuzz build -O
        working-directory: tpt-gis-raster/fuzz
