[package]
name = "tpt-gis-io-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone workspace: kept out of the parent `tpt-gis` workspace so it can be
# built/checked in isolation by cargo-fuzz (and `cargo check`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tpt-gis-io = { path = ".." }

[[bin]]
name = "geojson"
path = "fuzz_targets/geojson.rs"
test = false
doc = false

[[bin]]
name = "wkb"
path = "fuzz_targets/wkb.rs"
test = false
doc = false

[[bin]]
name = "wkt"
path = "fuzz_targets/wkt.rs"
test = false
doc = false

[[bin]]
name = "shapefile"
path = "fuzz_targets/shapefile.rs"
test = false
doc = false

[[bin]]
name = "geopackage"
path = "fuzz_targets/geopackage.rs"
test = false
doc = false

[[bin]]
name = "dbf"
path = "fuzz_targets/dbf.rs"
test = false
doc = false
