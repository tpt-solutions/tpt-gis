[package]
name = "tpt-gis-io"
description = "Parsers and writers for GeoJSON, WKB/WKT, Shapefile, and GeoPackage for tpt-gis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["gis", "geojson", "wkb", "shapefile", "geospatial"]
categories = ["science::geo", "parser-implementations"]

[lints]
workspace = true

[dependencies]
tpt-gis-geom = { path = "../tpt-gis-geom", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tpt-gis-core = { path = "../tpt-gis-core" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
