[workspace]
resolver = "2"
members = [
    "tpt-gis-core",
    "tpt-gis-geom",
    "tpt-gis-raster",
    "tpt-gis-io",
    "tpt-gis-index",
    "tpt-gis",
    "examples/drone-geofence-demo",
    "examples/spatial-join-cli",
    "tpt-gis-cli",
]
# Standalone packages that build for a special target / toolchain and must not be
# part of `cargo build --workspace` (or the host build would fail):
# - WASM geofence demo (cdylib, wasm32 only)
# - cargo-fuzz harnesses (each needs nightly + cargo-fuzz)
exclude = [
    "examples/wasm-geofence-demo",
    "tpt-gis-io/fuzz",
    "tpt-gis-raster/fuzz",
    "bindings/tpt-gis-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-gis"
homepage = "https://github.com/tpt-solutions/tpt-gis"

# Release/bench builds: thin LTO + one codegen unit trade a slower release compile for
# faster binaries (the CLI, benchmarks). Does not affect `cargo test` or dev builds.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
